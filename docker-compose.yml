services:
  db:
    image: postgres:17-alpine
    container_name: fizo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fizo
      POSTGRES_PASSWORD: fizo
      POSTGRES_DB: fizo
    ports:
      - "5432:5432"
    volumes:
      - fizo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fizo -d fizo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fizo-db-data:
